<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guido Anderloni</title>
    <script>
      // GitHub Pages has no server rewrite rules: unknown paths land here,
      // so the requested path is moved into the query string and the visitor
      // is sent back to index.html, which restores the real URL before React
      // Router mounts. One segment is kept for the /anderloni/ subpath.
      (function () {
        var keep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + keep).join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(keep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })();
    </script>
  </head>
  <body>
    <p>Reindirizzamento...</p>
  </body>
</html>
