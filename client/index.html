    <script>
      // Counterpart of 404.html: deep links arrive as "/?/path" on GitHub
      // and are rewritten to the real URL before the router reads it. The
      // first "&" separates path from query, "~and~" protects real "&".
      (function (l) {
        if (l.search.length > 1 && l.search.charAt(1) === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
